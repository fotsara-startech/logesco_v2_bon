services:
  - type: web
    name: logesco-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npx prisma generate --schema=prisma/schema.postgresql.prisma
    startCommand: chmod +x deploy-render.sh && ./deploy-render.sh && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgresql
      # DATABASE_URL pointe vers Neon (le meme projet que les postes clients
      # desktop) — defini directement dans le dashboard Render, pas ici.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 365d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 365d
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 8080
