services:
  - type: web
    name: logesco-api
    runtime: node
    rootDir: backend
    buildCommand: chmod +x deploy-render.sh && ./deploy-render.sh
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: logesco-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 365d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 365d
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 8080

databases:
  - name: logesco-db
    databaseName: logesco
    user: logesco_user
    plan: free
